<section class="flag-submit">
    <h2>Submit flag</h2>
    {% if current_level in solved_levels %}
    <p class="flag-msg flag-ok">This level is solved.</p>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <p class="flag-msg {% if category == 'success' %}flag-ok{% else %}flag-bad{% endif %}">{{ message }}</p>
        {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('submit_flag') }}">
        <input type="hidden" name="level" value="{{ current_level }}">
        <label for="flag">Flag</label>
        <input type="text" id="flag" name="flag" placeholder="FLAG{...}" autocomplete="off" spellcheck="false">
        <button type="submit">Submit flag</button>
    </form>
</section>
